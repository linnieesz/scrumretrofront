<div class="login-wrapper">
  <!-- Topo Decorativo Zig-Zag -->
  <div class="zigzag-pattern top"></div>

  <div class="login-container">
    <!-- Header / Logo -->
    <div class="brand-header">
      <h1 class="brand-title">Sprint<span>Retro</span></h1>
      <p class="brand-subtitle">Retrospectivas mais humanas para times ágeis</p>
    </div>

    <!-- Card Principal -->
    <div class="login-card">
      <h2 class="card-title">Entrar na conta</h2>
      <p class="card-subtitle">Bem-vindo(a) de volta 👋</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        @if (errorMessage()) {
        <div class="alert-error" role="alert">
          {{ errorMessage() }}
        </div>
        }
        <!-- Campo E-mail -->
        <div class="form-group">
          <label for="email">E-mail <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="seu&#64;email.com"
            [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        </div>

        <!-- Campo Senha -->
        <div class="form-group">
          <label for="password">Senha <span class="required">*</span></label>
          <div class="password-input-container">
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              id="password" 
              formControlName="password" 
              placeholder="Sua senha"
              [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <button 
              type="button" 
              class="btn-toggle-password" 
              (click)="togglePasswordVisibility()">
              {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <!-- Botão Entrar -->
        <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Entrando...' : 'Entrar →' }}
        </button>
      </form>

      <!-- Divisor e Seção de Acesso Rápido -->
      @if (demoUsers.length > 0) {
      <div class="demo-section">
        <p class="demo-title">ACESSO RÁPIDO (SOMENTE DESENVOLVIMENTO)</p>
        <div class="demo-grid">
          @for (user of demoUsers; track user.email) {
          <button type="button" class="demo-card" (click)="fillDemoUser(user)">
            <span class="avatar">{{ user.initials }}</span>
            <div class="user-info">
              <span class="user-name">{{ user.name }}</span>
              <span class="user-role">{{ roleLabel(user.role) }}</span>
            </div>
          </button>
          }
        </div>
      </div>
      }
    </div>

    <!-- Link de Cadastro no Rodapé -->
    <div class="signup-footer">
      Não tem uma conta? <a routerLink="/register">Cadastre-se</a>
    </div>
  </div>

  <!-- Rodapé Decorativo Zig-Zag -->
  <div class="zigzag-pattern bottom"></div>
</div>
